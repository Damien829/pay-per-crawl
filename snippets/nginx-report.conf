# AIPayGen AI crawler report for nginx.
# 1. FIRST install the reporter script and run it once. It creates /etc/nginx/aipaygen-ai-ips.conf,
#    which the lines below read (nginx -t fails while that file is missing):
#      sudo curl -fsS "https://aipaygen.com/downloads/aipaygen-nginx-report.sh?route=YOUR_ROUTE_ID" -o /usr/local/bin/aipaygen-report.sh
#      sudo chmod 700 /usr/local/bin/aipaygen-report.sh     # then put your gateway secret in it
#      sudo /usr/local/bin/aipaygen-report.sh
# 2. Add the lines below, then: sudo nginx -t && sudo nginx -s reload
# 3. Run the script every 10 minutes from root's crontab (sudo crontab -e):
#      */10 * * * * /usr/local/bin/aipaygen-report.sh
#    It sends the visit counts and keeps the address list fresh, reloading nginx only when the list
#    changed and nginx -t passes. If AIPayGen can't be reached it keeps what it has: your site is unaffected.

# In the http {} block, next to your existing access_log line:
map $http_user_agent $aipaygen_ua_bot { default ""; "~*(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot)" $1; }
# AI crawlers that hide their name, by address: the lists OpenAI, Anthropic, Perplexity, Mistral,
# DuckDuckGo and Common Crawl publish (the script above keeps this file fresh).
geo $aipaygen_ai_ip { default 0; include /etc/nginx/aipaygen-ai-ips.conf; }
map "$aipaygen_ua_bot|$aipaygen_ai_ip" $aipaygen_seen { default ""; "~^\|1$" "AI crawler (by IP)"; "~*^(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|CCBot|MistralAI\-User|DuckAssistBot)\|0$" "$1 (fake)"; "~^([^|]+)\|" $1; }
# The page as the crawler asked for it, without the query ($uri changes when a rewrite runs).
map $request_uri $aipaygen_path { default ""; "~^([^?]*)" $1; }
log_format aipaygen_ai escape=json '$aipaygen_seen\t$aipaygen_path';
access_log /var/log/nginx/aipaygen-ai.log aipaygen_ai if=$aipaygen_seen;
# If a server {} block has its own access_log lines, it doesn't inherit this one: copy the line above into it too.

# In your site's server {} block: this site's AI Terms (per-use terms for AI) at /.well-known/ai-terms.
location = /.well-known/ai-terms {
  # Looked up when a request needs it, not when nginx starts, so nginx always starts. If this server
  # can't reach 1.1.1.1 for DNS, use the nameserver from /etc/resolv.conf (127.0.0.53 on Ubuntu).
  resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
  resolver_timeout 5s;
  set $aipaygen_up https://aipaygen.com;
  proxy_pass $aipaygen_up/v1/gateway/terms/YOUR_ROUTE_ID;
  proxy_set_header Host aipaygen.com;
  proxy_ssl_server_name on;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
}
