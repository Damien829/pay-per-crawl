# AIPayGen AI crawler report for nginx. In the http {} block, next to your existing access_log line:
map $http_user_agent $aipaygen_ua_bot { default ""; "~*(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot)" $1; }
# AI crawlers that hide their name, by address. Create this file once (and refresh it from cron):
#   curl -fsS "https://aipaygen.com/v1/ai_bot_ips?format=nginx" -o /etc/nginx/aipaygen-ai-ips.conf
geo $aipaygen_ai_ip { default 0; include /etc/nginx/aipaygen-ai-ips.conf; }
map "$aipaygen_ua_bot|$aipaygen_ai_ip" $aipaygen_seen { default ""; "~^\|1$" "AI crawler (by IP)"; "~^([^|]+)\|" $1; }
log_format aipaygen_ai escape=json '$aipaygen_seen\t$uri';
access_log /var/log/nginx/aipaygen-ai.log aipaygen_ai if=$aipaygen_seen;
# If a server {} block has its own access_log lines, it doesn't inherit this one: copy the line above into it too.

# Then install the reporter and run it every 10 minutes from root's crontab (sudo crontab -e):
#   sudo curl -fsS "https://aipaygen.com/downloads/aipaygen-nginx-report.sh?route=YOUR_ROUTE_ID" -o /usr/local/bin/aipaygen-report.sh
#   sudo chmod 700 /usr/local/bin/aipaygen-report.sh     # then put your gateway secret in it
#   */10 * * * * /usr/local/bin/aipaygen-report.sh
