# Pay-per-crawl via AIPayGen (nginx): charging, added ON TOP of the AI crawler report setup.
# Install the report setup first and keep it: it defines $aipaygen_ai_ip (AI crawlers that hide their
# name, by the address lists OpenAI, Anthropic, Perplexity, Mistral, DuckDuckGo and Common Crawl publish),
# serves your AI Terms at /.well-known/ai-terms, and its cron script sends your visit counts and keeps
# the address list and your price fresh (it reloads nginx only when a file changed and nginx -t passes).
# 1. Create the price file once (your route must be charging, with a wallet):
#      sudo sh -c 'curl -fsS "https://aipaygen.com/v1/gateway/quote/YOUR_ROUTE_ID?format=nginx" -o /etc/nginx/aipaygen-quote.conf.new && mv /etc/nginx/aipaygen-quote.conf.new /etc/nginx/aipaygen-quote.conf'
# 2. Add the lines below, replace YOUR_GATEWAY_SECRET, then: sudo nginx -t && sudo nginx -s reload

# In the http {} block:
map $http_user_agent $aipaygen_bot { default 0; "~*(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot)" 1; }

# In your site's server {} block (next to the report's /.well-known/ai-terms location):
include /etc/nginx/aipaygen-quote.conf;
set $aipaygen 0;
if ($aipaygen_bot) { set $aipaygen 1; }
if ($aipaygen_ai_ip) { set $aipaygen 1; }
# A crawler retrying with a payment goes to AIPayGen, which verifies it, fetches the page and pays you.
if ($http_payment_signature != "") { set $aipaygen 2; }
if ($http_x_payment != "") { set $aipaygen 2; }
# The gateway fetching a page it was paid for: serve it normally. Replace with your gateway secret.
if ($http_x_aipaygen_gateway_secret = "YOUR_GATEWAY_SECRET") { set $aipaygen 0; }
# Your AI Terms file and robots.txt stay readable by every crawler: they are how it learns your rules and the price.
if ($uri = /.well-known/ai-terms) { set $aipaygen 0; }
if ($uri = /robots.txt) { set $aipaygen 0; }
# Charging switched off (report-only): the price file is empty, so every request is served normally.
if ($aipaygen_quote_b64 = "") { set $aipaygen 0; }
# Unpaid AI crawlers get your price from here; they never reach AIPayGen.
if ($aipaygen = 1) { rewrite ^ /__aipaygen_402 last; }
if ($aipaygen = 2) { rewrite ^(.*)$ /__aipaygen$1 last; }

location = /__aipaygen_402 {
  internal;
  default_type application/json;
  add_header payment-required $aipaygen_quote_b64 always;
  add_header cache-control no-store always;
  # AI Terms: this route's machine-readable terms, which a 402 should link.
  add_header link '<https://aipaygen.com/v1/gateway/terms/YOUR_ROUTE_ID>; rel="ai-terms"' always;
  return 402 $aipaygen_quote_json;
}

location ^~ /__aipaygen/ {
  internal;
  # Looked up when a request needs it, not when nginx starts, so nginx always starts. If this server
  # can't reach 1.1.1.1 for DNS, use the nameserver from /etc/resolv.conf (127.0.0.53 on Ubuntu).
  resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
  resolver_timeout 5s;
  set $aipaygen_up https://aipaygen.com;
  rewrite ^/__aipaygen(.*)$ /g/YOUR_ROUTE_ID$1 break;
  proxy_pass $aipaygen_up;
  proxy_set_header Host aipaygen.com;
  proxy_ssl_server_name on;
  # The payment and the usual request headers go on; the visitor's cookies and login do not.
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
}
