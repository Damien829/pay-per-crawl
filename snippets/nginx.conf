# Pay-per-crawl via AIPayGen (nginx). In the http {} block:
map $http_user_agent $aipaygen_bot { default 0; "~*(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|Google\-Extended|GoogleOther|CCBot|Bytespider|Amazonbot|Applebot\-Extended|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot)" 1; }

# In your site's server {} block:
set $aipaygen 0;
if ($aipaygen_bot) { set $aipaygen 1; }
if ($http_payment_signature != "") { set $aipaygen 1; }
if ($http_x_payment != "") { set $aipaygen 1; }
# The gateway fetching a page it was paid for: serve it normally. Replace with your gateway secret.
if ($http_x_aipaygen_gateway_secret = "YOUR_GATEWAY_SECRET") { set $aipaygen 0; }
if ($aipaygen) { rewrite ^ /__aipaygen$request_uri last; }

location ^~ /__aipaygen/ {
  internal;
  rewrite ^/__aipaygen(.*)$ /g/YOUR_ROUTE_ID$1 break;
  proxy_pass https://aipaygen.com;
  proxy_set_header Host aipaygen.com;
  proxy_ssl_server_name on;
  proxy_pass_request_headers on;
}
