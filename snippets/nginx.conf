# Pay-per-crawl via AIPayGen (nginx). In the http {} block:
map $http_user_agent $aipaygen_bot { default 0; "~*(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot)" 1; }
# AI crawlers that hide their name, by address (OpenAI, Perplexity, DuckDuckGo, Common Crawl lists).
geo $aipaygen_ai_ip { default 0; include /etc/nginx/aipaygen-ai-ips.conf; }
# Create both files once, then refresh them from cron (every hour is plenty):
#   curl -fsS "https://aipaygen.com/v1/ai_bot_ips?format=nginx" -o /etc/nginx/aipaygen-ai-ips.conf
#   curl -fsS "https://aipaygen.com/v1/gateway/quote/YOUR_ROUTE_ID?format=nginx" -o /etc/nginx/aipaygen-quote.conf
#   nginx -s reload

# In your site's server {} block:
include /etc/nginx/aipaygen-quote.conf;
set $aipaygen 0;
if ($aipaygen_bot) { set $aipaygen 1; }
if ($aipaygen_ai_ip) { set $aipaygen 1; }
# A crawler retrying with a payment goes to AIPayGen, which verifies it, fetches the page and pays you.
if ($http_payment_signature != "") { set $aipaygen 2; }
if ($http_x_payment != "") { set $aipaygen 2; }
# The gateway fetching a page it was paid for: serve it normally. Replace with your gateway secret.
if ($http_x_aipaygen_gateway_secret = "YOUR_GATEWAY_SECRET") { set $aipaygen 0; }
# Your AI Terms file stays readable by every crawler: it is how they learn the price.
if ($uri = /.well-known/ai-terms) { set $aipaygen 0; }
# Unpaid AI crawlers get your price from here; they never reach AIPayGen.
if ($aipaygen = 1) { rewrite ^ /__aipaygen_402 last; }
if ($aipaygen = 2) { rewrite ^(.*)$ /__aipaygen$1 last; }

location = /__aipaygen_402 {
  internal;
  default_type application/json;
  add_header payment-required $aipaygen_quote_b64 always;
  add_header cache-control no-store always;
  return 402 $aipaygen_quote_json;
}

# This site's AI Terms (per-use terms for AI) at /.well-known/ai-terms.
location = /.well-known/ai-terms {
  proxy_pass https://aipaygen.com/v1/gateway/terms/YOUR_ROUTE_ID;
  proxy_set_header Host aipaygen.com;
  proxy_ssl_server_name on;
}

location ^~ /__aipaygen/ {
  internal;
  rewrite ^/__aipaygen(.*)$ /g/YOUR_ROUTE_ID$1 break;
  proxy_pass https://aipaygen.com;
  proxy_set_header Host aipaygen.com;
  proxy_ssl_server_name on;
  proxy_pass_request_headers on;
}
