# Pay-per-crawl via AIPayGen (Apache 2.4). Needs mod_rewrite, mod_setenvif and mod_headers
# (Debian/Ubuntu: sudo a2enmod rewrite headers). Paid retries also need mod_proxy, mod_proxy_http and mod_ssl.
#
# 1. FIRST install the helper script and run it once. It creates /var/lib/aipaygen, which the lines
#    below write to: Apache will not start if that folder is missing.
#      sudo curl -fsS "https://aipaygen.com/downloads/aipaygen-apache.sh?route=YOUR_ROUTE_ID" -o /usr/local/bin/aipaygen-apache.sh
#      sudo chmod 700 /usr/local/bin/aipaygen-apache.sh     # then put your gateway secret in it
#      sudo /usr/local/bin/aipaygen-apache.sh
# 2. Paste the lines below inside your site's <VirtualHost> block (not .htaccess), above your own
#    Rewrite and Proxy lines, and replace YOUR_GATEWAY_SECRET.
# 3. sudo apachectl configtest && sudo apachectl graceful
# 4. Run the script every 10 minutes from root's crontab (sudo crontab -e):
#      */10 * * * * /usr/local/bin/aipaygen-apache.sh
#
# If this virtual host has no CustomLog line of its own, add your usual one too (for example
# CustomLog ${APACHE_LOG_DIR}/access.log combined): a virtual host with any CustomLog stops
# writing to the server-wide access log.

# Which requests are AI crawlers: by address first (the lists OpenAI, Anthropic, Perplexity, Mistral,
# DuckDuckGo and Common Crawl publish; the script keeps this file fresh), then by name.
IncludeOptional /var/lib/aipaygen/ai-ips.conf
SetEnvIfNoCase User-Agent "(GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot)" aipaygen_bot=$1
# Their visits, one line each (crawler name and path only), for your report.
CustomLog /var/lib/aipaygen/visits.log "%<{aipaygen_bot}e\t%U" env=aipaygen_bot

<Directory /var/lib/aipaygen>
  Require all granted
  ForceType application/json
  Header set Access-Control-Allow-Origin "*"
</Directory>
# An unpaid AI crawler gets your price from a file on this server; it never reaches AIPayGen.
ErrorDocument 402 /__aipaygen_402
Header always set payment-required "expr=%{file:/var/lib/aipaygen/quote.b64}" "expr=%{REQUEST_STATUS} -eq 402"
Header always set cache-control "no-store" "expr=%{REQUEST_STATUS} -eq 402"
# AI Terms: this route's machine-readable terms, which a 402 should link.
Header always set link "<https://aipaygen.com/v1/gateway/terms/YOUR_ROUTE_ID>; rel=\"ai-terms\"" "expr=%{REQUEST_STATUS} -eq 402"

RewriteEngine On
# This site's AI Terms (per-use terms for AI), served at /.well-known/ai-terms.
RewriteCond /var/lib/aipaygen/ai-terms.json -f
RewriteRule ^/\.well-known/ai-terms$ /var/lib/aipaygen/ai-terms.json [L]
RewriteCond %{ENV:REDIRECT_STATUS} =402
RewriteRule ^/__aipaygen_402$ /var/lib/aipaygen/quote.json [L]

# Charge: only while your route charges (the script creates /var/lib/aipaygen/charging then and
# removes it in report-only mode, so you switch modes in your AIPayGen settings, not here).
RewriteCond %{ENV:aipaygen_bot} .
# The gateway fetching a page it was paid for: serve it normally. Replace with your gateway secret.
RewriteCond %{HTTP:X-AIPayGen-Gateway-Secret} !=YOUR_GATEWAY_SECRET
# robots.txt and the terms file are free for every crawler: they are how it learns your rules and the price.
RewriteCond %{REQUEST_URI} !^/(robots\.txt|\.well-known/ai-terms|__aipaygen_402)$
RewriteCond %{HTTP:Payment-Signature}%{HTTP:X-Payment} ^$
RewriteCond /var/lib/aipaygen/charging -f
RewriteRule ^ - [R=402,L]

# A crawler retrying with a payment goes to AIPayGen, which verifies it, fetches the page and pays you.
<IfModule mod_ssl.c>
  SSLProxyEngine on
</IfModule>
<IfModule mod_proxy_http.c>
  RewriteCond %{HTTP:X-AIPayGen-Gateway-Secret} !=YOUR_GATEWAY_SECRET
  RewriteCond %{REQUEST_URI} !^/(robots\.txt|\.well-known/ai-terms)$
  RewriteCond %{HTTP:Payment-Signature}%{HTTP:X-Payment} .
  RewriteCond /var/lib/aipaygen/charging -f
  RewriteRule ^/?(.*)$ https://aipaygen.com/g/YOUR_ROUTE_ID/$1 [P,L,QSA]
</IfModule>
