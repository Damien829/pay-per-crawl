# Pay-per-crawl via AIPayGen (Apache 2.4). Needs mod_rewrite, mod_proxy, mod_proxy_http and mod_ssl.
# In the server or virtual host config (SSLProxyEngine can't go in .htaccess):
SSLProxyEngine on

# In the virtual host or .htaccess:
RewriteEngine On
# This site's AI Terms (per-use terms for AI), served at /.well-known/ai-terms.
RewriteRule ^/?\.well-known/ai-terms$ https://aipaygen.com/v1/gateway/terms/YOUR_ROUTE_ID [P,L]
# The gateway fetching a page it was paid for: serve it normally. Replace with your gateway secret.
RewriteCond %{HTTP:X-AIPayGen-Gateway-Secret} !=YOUR_GATEWAY_SECRET
RewriteCond %{HTTP_USER_AGENT} (GPTBot|OAI\-SearchBot|ChatGPT\-User|ClaudeBot|Claude\-User|Claude\-SearchBot|anthropic\-ai|PerplexityBot|Perplexity\-User|GoogleOther|CCBot|Bytespider|Amazonbot|meta\-externalagent|FacebookBot|cohere\-ai|Diffbot|YouBot|MistralAI\-User|DuckAssistBot|PetalBot|Timpibot|ImagesiftBot|omgili|AI2Bot|ElevenlabsCrawler|ElevenlabsBot) [NC,OR]
RewriteCond %{HTTP:Payment-Signature} .+ [OR]
RewriteCond %{HTTP:X-Payment} .+
RewriteRule ^/?(.*)$ https://aipaygen.com/g/YOUR_ROUTE_ID/$1 [P,L,QSA]
